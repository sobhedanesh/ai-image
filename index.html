      "Ukiyo-e Japanese Woodblock": "Describe the image... (e.g. A samurai standing by a wave in the style of Hokusai)",
      "Sumi-e Ink Wash": "Describe the image... (e.g. A bamboo forest painted with black ink brush strokes)",
      "Gouache Painting": "Describe the image... (e.g. A portrait of a knight with matte opaque colors)",
      "Vector Art": "Describe the image... (e.g. A clean flat design of a futuristic city)",
      "Superflat Art": "Describe the image... (e.g. A flat graphic portrait with pop art flowers)",
      "Cel Shaded": "Describe the image... (e.g. A modern anime character with hard outlines and shadows)",
      "Lineless Art": "Describe the image... (e.g. A soft dreamy landscape without any black outlines)",
      "Low Poly 3D Anime": "Describe the image... (e.g. A chibi character standing in a blocky town)",
      "Voxel Art Anime": "Describe the image... (e.g. A castle made of tiny 3D cubes)",
      "Glitch Art Anime": "Describe the image... (e.g. A girl with digital distortion and corrupted pixels)",
      "VHS Tape Effect Anime": "Describe the image... (e.g. A quiet scene with scanlines and analog grain)",
      "Film Noir Anime": "Describe the image... (e.g. A mysterious figure in a dark alley with high contrast shadows)",
      "Paper Cutout Style": "Describe the image... (e.g. A layered landscape made of colored paper)",
      "Silkscreen Art": "Describe the image... (e.g. A retro anime poster with halftone dots)",
      "Western Anime Style": "Describe the image... (e.g. A group of friends on an adventure in a stylized world)",
      "Graffiti Art Anime Style": "Describe the image... (e.g. A character painted on a brick wall with spray paint)",
      "Survival Game Anime": "Describe the image... (e.g. A player holding a weapon in a tense forest arena)",
      "Post-Apocalyptic Anime": "Describe the image... (e.g. A traveler walking through a ruined city overgrown with plants)",
      "Type-Moon Style": "Describe the image... (e.g. A knight in blue armor holding a magical sword)",
      "Daisuke Ishiwatari Style": "Describe the image... (e.g. a rockstar character playing guitar with fire)",
      "Yusuke Murata Style": "Describe the image... (e.g. A hero punching a monster with hyper-detailed impact effects)",
      "Tatsuki Style": "Describe the image... (e.g. A cute animal friend standing in a 3D park)"
    };
    let defaultPlaceholder = "Describe the image you want to generate...";

    // Update placeholder when style changes
    styleInput.onchange = function() {
      promptInput.placeholder = stylePlaceholderHints[this.value] || defaultPlaceholder;
    };

    async function generateImage() {
      let prompt = promptInput.value.trim();
      if(!prompt) return;

      let style = styleInput.value;
      let resolution = resolutionInput.value;

      // Construct prompt with detailed style enhancement
      let fullPrompt = prompt;
      if (style) {
        // Use the detailed enhancement mapping for high quality results
        let enhancement = styleEnhancements[style] || `, ${style} style, highly detailed, sharp focus, 8k, masterpiece`;
        fullPrompt += enhancement;
      }

      generateBtn.disabled = true;
      generateBtn.textContent = "Generating...";
      generateBtn.style.opacity = "0.7";
      
      placeholderText.hidden = true;
      resultImg.hidden = true;
      imgLoadingSpinner.hidden = false;
      downloadImgBtn.hidden = false; 

      try {
        // Pass resolution to generateImage
        let dataUrl = await root.generateImage(fullPrompt, {resolution: resolution});
        
        resultImg.src = dataUrl;
        resultImg.onload = () => {
          imgLoadingSpinner.hidden = true;
          resultImg.hidden = false;
          downloadImgBtn.hidden = false; 
        };
      } catch(e) {
        placeholderText.hidden = false;
        placeholderText.textContent = "Error generating image. Try again.";
        imgLoadingSpinner.hidden = true;
        console.error(e);
      }

      generateBtn.disabled = false;
      generateBtn.textContent = "Generate Image";
      generateBtn.style.opacity = "1";
    }

    generateBtn.onclick = generateImage;

    // Download image action feature
    window.downloadImage = function() {
      let link = document.createElement("a");
      link.href = resultImg.src;
      link.download = "generated-image.png";
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    };

    // Animation for spinner
    let styleSheet = document.createElement("style");
    styleSheet.innerText = `@keyframes spin { 100% { transform: rotate(360deg); } }`;
    document.head.appendChild(styleSheet);

  </script>
</div>
